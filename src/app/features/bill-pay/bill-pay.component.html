<div class="page">
  <bofa-page-header eyebrow="Bill pay" title="Pay your bills" subtitle="Schedule one-time payments to your saved payees."></bofa-page-header>
  <div class="layout">
    <mat-card>
      <mat-card-title>Payees</mat-card-title>
      <div class="payee" *ngFor="let p of payees" [class.selected]="p === selected" (click)="choose(p)" data-test="payee">
        <span>{{ p.name }}<br /><small class="muted">{{ p.category }} · {{ p.accountNumber | bofaMask }}</small></span>
        <mat-icon *ngIf="p === selected">check</mat-icon>
      </div>
    </mat-card>
    <mat-card>
      <mat-card-title>{{ selected ? 'Pay ' + selected.name : 'Select a payee' }}</mat-card-title>
      <form [formGroup]="form" (ngSubmit)="pay()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Pay from</mat-label>
          <mat-select formControlName="fromAccountId">
            <mat-option *ngFor="let a of accounts" [value]="a.id">{{ a.name }} {{ a.number | bofaMask }}</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Amount</mat-label>
          <span matPrefix>$&nbsp;</span>
          <input matInput type="number" formControlName="amount" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Deliver by</mat-label>
          <input matInput [matDatepicker]="picker" [min]="minDate" formControlName="deliverBy" />
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit" [disabled]="!selected" anTrack="billpay_submit">Schedule payment</button>
      </form>
    </mat-card>
  </div>
</div>
